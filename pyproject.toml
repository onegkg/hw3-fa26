[project]
name = "searchengine"
version = "0.1.0"
description = "A small search engine for COSI 106B HW3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.scripts]
search = "searchengine.cli:cli"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3.8,<4",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/test_normalize.py", "tests/test_search.py", "tests/pbt"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["searchengine"]

# Mutation testing (Task 8). `make mutmut` runs it; see ARTIFACT.md.
[tool.mutmut]
source_paths = ["src/searchengine/"]
only_mutate = ["src/searchengine/normalize.py"]
pytest_add_cli_args_test_selection = ["tests/test_normalize.py", "tests/test_search.py", "tests/pbt"]
also_copy = ["corpus"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
